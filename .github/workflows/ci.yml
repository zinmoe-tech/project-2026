name: CI

on:
  push:    # run on pushes to any branch
  pull_request:    # run on PRs targeting any branch
  workflow_dispatch: # allow manual runs from the Actions UI

jobs:
  check-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify index.html contains expected text
        run: |
          if ! grep -q "Hi" index.html; then
            echo "index.html does not contain the expected text 'Hi'" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt

      - name: Run Python tests
        run: |
          pytest -q service
