name: Build and Deploy

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: docker.io/zinmoe8988/git-action-service
  DEPLOYMENT_NAME: service-deployment   # adjust to your k8s Deployment name
  CONTAINER_NAME: service               # adjust to the container name in the Deployment

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "::set-output name=sha::${GITHUB_SHA::8}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.KUBE_CONFIG != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Decode KUBECONFIG
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig
          chmod 600 kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Update k8s Deployment image
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.sha }}
        run: |
          # NOTE: replace DEPLOYMENT_NAME and CONTAINER_NAME in env above if needed
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${ { env.CONTAINER_NAME }}=${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.sha }} --record
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=120s
